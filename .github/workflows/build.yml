name: build-and-release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal
      - name: Site self-test
        run: node tools/site-selftest.mjs

  publish:
    name: publish AOT ${{ matrix.rid }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish desktop (Native AOT)
        run: dotnet publish src/ResumeMaker.Desktop -c Release -r ${{ matrix.rid }} -o out/desktop-${{ matrix.rid }}
      - name: Publish web server (Native AOT)
        run: dotnet publish src/ResumeMaker.Web -c Release -r ${{ matrix.rid }} -o out/web-${{ matrix.rid }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "out/desktop-${{ matrix.rid }}/*" -DestinationPath "dist/ResumeMaker.Desktop-${{ matrix.rid }}.zip"
          Compress-Archive -Path "out/web-${{ matrix.rid }}/*" -DestinationPath "dist/ResumeMaker.Web-${{ matrix.rid }}.zip"
          Get-ChildItem dist/*.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
          }
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/ResumeMaker.Desktop-${{ matrix.rid }}.tar.gz -C out/desktop-${{ matrix.rid }} .
          tar -czf dist/ResumeMaker.Web-${{ matrix.rid }}.tar.gz -C out/web-${{ matrix.rid }} .
          cd dist && for f in *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: ResumeMaker-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
